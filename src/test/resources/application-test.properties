# ---------------------------------------------------------------------------
# Perfil de PRUEBAS - Fase 1.4 / Fase 1.5 del docs/PLAN_API_WEB.md
# ---------------------------------------------------------------------------
# H2 embebida SOLO para pruebas automatizadas. No sustituye ni altera la
# configuracion real de MySQL definida en
# src/main/resources/application.properties.
#
# MODE=MySQL hace que H2 acepte el SQL de las migraciones (AUTO_INCREMENT) y
# DATABASE_TO_LOWER=TRUE conserva los nombres de tabla/columna en minusculas,
# como en MySQL.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:nexusmarket;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Esquema: lo crea Flyway con las mismas migraciones que MySQL; Hibernate solo
# valida que el modelo JPA coincida.
spring.jpa.hibernate.ddl-auto=validate

# Las pruebas deben usar el datasource configurado arriba (H2 en MODE=MySQL),
# no un datasource embebido generado por Spring Boot.
spring.test.database.replace=none
