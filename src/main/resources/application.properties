spring.application.name=nexusmarket
server.port=${PORT:8080}

# ---------------------------------------------------------------------------
# Persistencia - Fase 1.4 del docs/PLAN_API_WEB.md
# ---------------------------------------------------------------------------
# MySQL es la base de datos de ejecucion y produccion. Las credenciales se
# suministran por VARIABLES DE ENTORNO: no se guarda ninguna credencial real
# en el repositorio.
#
#   DB_URL      URL JDBC de MySQL (por defecto: instancia local)
#   DB_USER     usuario
#   DB_PASSWORD contrasena
#
# Las pruebas usan el perfil "test" con H2 embebida
# (src/test/resources/application-test.properties). H2 NO es la base de datos
# real y no sustituye a MySQL.
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/nexusmarket}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}

# Esquema: Flyway es la fuente unica (Fase 1.5 del docs/PLAN_API_WEB.md); las
# migraciones viven en src/main/resources/db/migration. Hibernate NO modifica el
# esquema: solo valida que el modelo JPA coincida con la base de datos.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
