# ---------------------------------------------------------------------------
# Perfil de PRUEBAS - Fase 1.4 del docs/PLAN_API_WEB.md
# ---------------------------------------------------------------------------
# H2 embebida SOLO para pruebas automatizadas. No sustituye ni altera la
# configuracion real de MySQL definida en
# src/main/resources/application.properties.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:nexusmarket;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Esquema efimero: se crea al iniciar el contexto y se destruye al terminar.
spring.jpa.hibernate.ddl-auto=create-drop
