# ---------------------------------------------------------------------------
# Perfil MySQL - Fase 1.7 del docs/PLAN_API_WEB.md
# ---------------------------------------------------------------------------
# Pruebas de integracion contra MySQL REAL. H2 NO se usa en este perfil: aqui se
# verifican las migraciones de Flyway, el esquema validado por Hibernate y los
# adaptadores sobre el mismo motor que la ejecucion real.
#
# Requiere una instancia MySQL accesible y credenciales por variables de entorno:
#
#   DB_URL      jdbc:mysql://127.0.0.1:3307/nexusmarket
#   DB_USER     root
#   DB_PASSWORD contrasena
#
# La base de datos debe existir; Flyway crea el esquema desde cero.
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3307/nexusmarket}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# El esquema lo crea Flyway con las mismas migraciones que en produccion;
# Hibernate solo valida que el modelo JPA coincida con MySQL.
spring.jpa.hibernate.ddl-auto=validate
